[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/formulario"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/formulario"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[redirects]]
  from = "/formulario-pdf"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/formulario-pdf"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
